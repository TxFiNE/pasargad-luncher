- 🎨 **آیکون جدید**

## دانلود / Download

- `Pasargad-Launcher-Setup-1.3.1.exe` ← نسخه‌ی نصبی با آپدیت خودکار (پیشنهادی)
- `Pasargad-Launcher-Portable-1.3.1.exe` ← نسخه‌ی قابل‌حمل، بدون آپدیت خودکار

> اگر ویندوز SmartScreen هشدار داد: **More info ← Run anyway** (برنامه امضای دیجیتال ندارد).
